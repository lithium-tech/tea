name: smoke-tests

# Reusable workflow: run the full tea smoke-test suite against a prebuilt
# runtime artifact inside the Tea build container. Called by ci.yml once per
# fork (arenadata + open-gpdb).
on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the runtime artifact to download
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/lithium-tech/tea-build:ubuntu22.04-latest
      options: >-
        --user root
        -h cdw
    defaults:
      run:
        shell: sudo -E -u gpadmin HOME=/home/gpadmin USER=gpadmin bash --noprofile --norc -eo pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - metadata_type: teapot
            table_type: foreign
            profile: ""
          - metadata_type: iceberg
            table_type: foreign
            profile: samovar
          - metadata_type: iceberg
            table_type: foreign
            profile: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare workspace ownership
        shell: bash
        run: chown -R gpadmin:gpadmin "$GITHUB_WORKSPACE" /home/gpadmin

      - name: Initialize test container
        run: |
          mkdir -p build-logs/details build-logs/results
          if [ -x /tmp/init_system.sh ]; then
            /tmp/init_system.sh 2>&1 | tee build-logs/details/container-init.log
          fi
          df -h | tee build-logs/details/disk-usage-before-tests.log
          free -h | tee build-logs/details/memory-before-tests.log

      - name: Download runtime artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ci-artifacts

      - name: Restore runtime files
        run: bash ci/restore-runtime.sh

      - name: Initialize Greenplum cluster
        run: bash ci/start-cluster.sh --create-extension 2>&1 | tee build-logs/details/start-cluster.log

      - name: Start Iceberg services (Minio + HMS) and upload test data
        run: bash ci/start-iceberg.sh 2>&1 | tee build-logs/details/start-iceberg.log

      - name: Deploy tea config
        run: bash ci/deploy-tea-config.sh 2>&1 | tee build-logs/details/deploy-tea-config.log

      - name: Start Redis
        run: |
          redis-server --daemonize yes --dir /tmp --logfile build-logs/details/redis.log --pidfile /tmp/redis.pid
          redis-cli ping

      - name: Run smoke tests
        run: bash ci/run-smoke.sh "${{ matrix.metadata_type }}" "${{ matrix.table_type }}" "${{ matrix.profile }}" 2>&1 | tee build-logs/details/smoke-${{ matrix.metadata_type }}-${{ matrix.table_type }}-${{ matrix.profile || 'default' }}.log

      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ inputs.artifact_name }}-${{ matrix.metadata_type }}-${{ matrix.table_type }}-${{ matrix.profile || 'default' }}
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload smoke test results files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ inputs.artifact_name }}-${{ matrix.metadata_type }}-${{ matrix.table_type }}-${{ matrix.profile || 'default' }}
          path: |
            **/regression.out
            **/regression.diffs
            **/results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect smoke regression logs
        if: failure() || cancelled()
        run: |
          mkdir -p build-logs/regression
          find /gpdata -type f -path '*/log/*' -exec cp --parents '{}' build-logs/regression/ \; || true

      - name: Upload smoke regression logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-regression-logs-${{ inputs.artifact_name }}-${{ matrix.metadata_type }}-${{ matrix.table_type }}-${{ matrix.profile || 'default' }}
          path: |
            build-logs/regression/
            **/regression.out
            **/regression.diffs
            **/results/
            **/yproxy.log
          if-no-files-found: ignore
          retention-days: 7
