name: GP6 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  clang-format:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check C/C++ formatting
        run: |
          git ls-files \
            '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' \
            ':!:build/**' \
            ':!:vendor/**' \
            | xargs -r clang-format --dry-run -Werror

  build-tea-agp:
    uses: ./.github/workflows/build.yml
    with:
      gpdb_repo: https://github.com/arenadata/gpdb.git
      gpdb_ref: 6.29.1_arenadata68
      artifact_name: tea-runtime

  # Build tea against open-gpdb (instead of arenadata/gpdb) to make sure it
  # keeps compiling/linking there. open-gpdb diverges from other Greenplum
  # forks (e.g. it moved the sampling helpers into utils/sampling.h and
  # removed the legacy anl_* API); tea selects the right API via the OPENGPDB
  # macro that open-gpdb defines in pg_config_manual.h. This job guards that
  # path (open_gpdb: true enables the fork-specific build fixups and checks).
  build-tea-open-gpdb:
    uses: ./.github/workflows/build.yml
    with:
      gpdb_repo: https://github.com/open-gpdb/gpdb.git
      gpdb_ref: OPENGPDB_STABLE
      artifact_name: tea-runtime-open-gpdb
      open_gpdb: true

  smoke-tests-agp:
    needs: build-tea-agp
    uses: ./.github/workflows/smoke-tests.yml
    with:
      artifact_name: tea-runtime

  # Run the full tea smoke-test suite against open-gpdb. Kept separate (needs
  # only build-tea-open-gpdb) so the arenadata smoke-tests do not wait on the
  # open-gpdb build.
  smoke-tests-open-gpdb:
    needs: build-tea-open-gpdb
    uses: ./.github/workflows/smoke-tests.yml
    with:
      artifact_name: tea-runtime-open-gpdb
      enable_external_tables: false

  rest-tests-agp:
    needs: build-tea-agp
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/lithium-tech/tea-build:ubuntu22.04-latest
      options: >-
        --user root
        -h cdw
    defaults:
      run:
        shell: sudo -E -u gpadmin HOME=/home/gpadmin USER=gpadmin bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare workspace ownership
        shell: bash
        run: chown -R gpadmin:gpadmin "$GITHUB_WORKSPACE" /home/gpadmin

      - name: Initialize REST test container
        run: |
          mkdir -p build-logs/details build-logs/results
          if [ -x /tmp/init_system.sh ]; then
            /tmp/init_system.sh 2>&1 | tee build-logs/details/container-init.log
          fi
          df -h | tee build-logs/details/disk-usage-before-rest-tests.log
          free -h | tee build-logs/details/memory-before-rest-tests.log

      - name: Install REST test dependencies
        shell: bash
        run: |
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | apt-key add -
          add-apt-repository -y "deb http://apt.postgresql.org/pub/repos/apt jammy-pgdg main"
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-16 postgresql-client-16
          pg_dropcluster 14 main || true
          pg_dropcluster 16 main || true

      - name: Download runtime artifacts
        uses: actions/download-artifact@v4
        with:
          name: tea-runtime
          path: ci-artifacts

      - name: Restore runtime files
        run: |
          mkdir -p "$HOME/local"
          tar -xzf ci-artifacts/gpdb-with-tea.tar.gz -C "$HOME/local"

      - name: Initialize Greenplum cluster
        run: bash ci/start-cluster.sh 2>&1 | tee build-logs/details/start-cluster.log

      - name: Start Minio and upload test data
        run: |
          wget -q https://dl.min.io/server/minio/release/linux-amd64/minio -O /tmp/minio
          wget -q https://dl.min.io/client/mc/release/linux-amd64/mc -O /tmp/mc
          chmod +x /tmp/minio /tmp/mc

          export CI_PROJECT_DIR=$PWD

          MINIO_EXECUTABLE=/tmp/minio MC_EXECUTABLE=/tmp/mc \
          MINIO_DATA_DIR=/tmp/minio-data \
            bash test/iceberg/gen/init_minio.sh 2>&1 | tee build-logs/details/start-minio.log

      - name: Deploy tea config
        run: bash ci/deploy-tea-config.sh test/config/tea-config-rest.json 2>&1 | tee build-logs/details/deploy-tea-config.log

      - name: Start Lakekeeper
        shell: bash
        run: |
          pg_createcluster -p 5433 --locale=C.UTF-8 --encoding=UTF8 16 main
          sed -i 's/scram-sha-256/trust/g' /etc/postgresql/16/main/pg_hba.conf
          /etc/init.d/postgresql start

          wget -q https://github.com/lakekeeper/lakekeeper/releases/download/v0.12.1/lakekeeper-x86_64-unknown-linux-gnu.tar.gz -O - | tar -xzf -
          export LAKEKEEPER__PG_DATABASE_URL_READ="postgres://postgres@localhost:5433/postgres"
          export LAKEKEEPER__PG_DATABASE_URL_WRITE="postgres://postgres@localhost:5433/postgres"
          export LAKEKEEPER__METRICS__PORT=0
          ./lakekeeper migrate
          psql -h localhost -p 5433 -U postgres -f test/iceberg/gen/setup_lakekeeper.sql postgres
          ./lakekeeper serve &
          sleep 5

      - name: Check REST catalog support
        run: |
          source $HOME/local/gpdb/greenplum_path.sh
          export PGDATABASE=tea_ci
          psql -c 'CREATE EXTENSION tea'

          CFT=`psql -Atc "SELECT tea_fdw_get_create_query('rest_test', 'tea://iceberg://gperov.test')"`
          echo $CFT
          [[ "$CFT" = "create foreign table rest_test (a bigint, b bigint) server tea_server options(location 'tea://iceberg://gperov.test');" ]] || exit 1
          
          psql -c "$CFT"
          OUT=`psql -Atc "SELECT count(*), sum(a), sum(b) FROM rest_test"`
          echo $OUT
          [[ "$OUT" = "9999|49992899|99985798" ]] || exit 1

      - name: Collect REST service logs
        if: always()
        run: |
          mkdir -p build-logs/services/minio
          cp -R /tmp/minio-data/. build-logs/services/minio/ 2>/dev/null || true

      - name: Upload REST test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-test-logs-tea-runtime
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect REST regression logs
        if: failure() || cancelled()
        run: |
          mkdir -p build-logs/regression
          find /gpdata -type f -path '*/log/*' -exec cp --parents '{}' build-logs/regression/ \; || true

      - name: Upload REST regression logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: rest-regression-logs-tea-runtime
          path: |
            build-logs/regression/
            **/regression.out
            **/regression.diffs
            **/results/
            **/yproxy.log
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Generate GP6 CI report
    needs:
      - clang-format
      - build-tea-agp
      - build-tea-open-gpdb
      - smoke-tests-agp
      - smoke-tests-open-gpdb
      - rest-tests-agp
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Generate final report
        run: |
          {
            echo "# GP6 CI Pipeline Report"
            echo ""
            echo "## Job Status"
            echo "- clang-format: ${{ needs.clang-format.result }}"
            echo "- build-tea-agp: ${{ needs.build-tea-agp.result }}"
            echo "- build-tea-open-gpdb: ${{ needs.build-tea-open-gpdb.result }}"
            echo "- smoke-tests-agp: ${{ needs.smoke-tests-agp.result }}"
            echo "- smoke-tests-open-gpdb: ${{ needs.smoke-tests-open-gpdb.result }}"
            echo "- rest-tests-agp: ${{ needs.rest-tests-agp.result }}"
            echo "- Completion Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo ""

            if [[ "${{ needs.clang-format.result }}" == "success" \
              && "${{ needs.build-tea-agp.result }}" == "success" \
              && "${{ needs.build-tea-open-gpdb.result }}" == "success" \
              && "${{ needs.smoke-tests-agp.result }}" == "success" \
              && "${{ needs.smoke-tests-open-gpdb.result }}" == "success" \
              && "${{ needs.rest-tests-agp.result }}" == "success" ]]; then
              echo "✅ Pipeline completed successfully"
            else
              echo "⚠️ Pipeline completed with failures"
              echo ""
              echo "Check uploaded build/test logs and regression artifacts for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail report when required jobs failed
        if: |
          needs.clang-format.result != 'success' ||
          needs.build-tea-agp.result != 'success' ||
          needs.build-tea-open-gpdb.result != 'success' ||
          needs.smoke-tests-agp.result != 'success' ||
          needs.smoke-tests-open-gpdb.result != 'success' ||
          needs.rest-tests-agp.result != 'success'
        run: |
          echo "::error::GP6 CI failed. Check job summaries and uploaded logs for details."
          exit 1
